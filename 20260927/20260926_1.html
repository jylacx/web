<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻味顺德·18关美食挑战（交互地图版）</title>
<style>
  :root{
    --paper:#fffdf7;
    --ink:#3a2c1f;
    --orange:#e67e22;
    --green:#2e7d32;
    --yellow:#f9a825;
  }
  *{box-sizing:border-box;}
  
  /* 调整 body 布局，确保地图在屏幕正中间且完整显示 */
  body{
    margin:0;
    min-height:100vh;
    background:#fdf3e3;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow: hidden; /* 防止出现多余的滚动条 */
  }

  /* 地图容器：紧贴图片大小，让热区百分比精准对应 */
  .map-wrapper{
    position:relative;
    display:inline-block; /* 关键：让容器大小完美包裹图片 */
    max-width:100%;
    max-height:98vh;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    background:#f5e6c8;
  }
  
  /* 图片：强制在屏幕内完整显示 */
  .map-wrapper img{
    display:block;
    max-width:100%;
    max-height:98vh; /* 关键：限制高度，确保完整显示 */
    width:auto;
    height:auto;
    object-fit:contain; /* 保持原比例，不拉伸裁剪 */
  }

  /* 点击热区 */
  .hotspot{
    position:absolute;
    width:5%; /* 热区大小 */
    aspect-ratio:1;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:2px dashed transparent;
    cursor:pointer;
    transition:all .2s;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  .hotspot:hover{
    background:rgba(230,126,34,0.4);
    border-color:#d35400;
    transform:scale(1.3);
    z-index:20;
  }
  .hotspot::after{
    content:attr(data-num);
    font-size:16px;
    color:#fff;
    background:#d35400;
    border-radius:50%;
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    opacity:0;
    transition:opacity .2s;
  }
  .hotspot:hover::after{opacity:1;}

  /* 模态框（弹出卡片） */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.active{display:flex;}
  .modal-card{
    background:var(--paper);
    width:min(680px, 96vw);
    max-height:90vh;
    border-radius:16px;
    padding:26px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    overflow-y:auto;
    position:relative;
    animation:popIn .3s ease;
  }
  @keyframes popIn{
    from{transform:scale(.9);opacity:.5;}
    to{transform:scale(1);opacity:1;}
  }
  .close-btn{
    position:absolute;
    top:12px;
    right:16px;
    background:none;
    border:none;
    font-size:28px;
    color:#8d6e63;
    cursor:pointer;
    line-height:1;
  }
  .close-btn:hover{color:#d35400;}
  .modal-card h2{
    font-size:26px;
    color:#b23c17;
    margin:0 0 16px 0;
  }
  .route-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    background:#fff3e0;
    border:1px dashed var(--orange);
    border-radius:999px;
    padding:9px 16px;
    font-weight:700;
    color:#8d4e00;
    margin-bottom:16px;
    font-size:14px;
  }
  .food-desc,
  .check,
  .math{
    border-radius:12px;
    padding:12px 16px;
    margin:12px 0;
    line-height:1.8;
    font-size:15px;
  }
  .food-desc{background:#f1f8e9; border-left:6px solid #7cb342;}
  .check{background:#fce4ec; border-left:6px solid #d81b60;}
  .math{background:#fff8e1; border-left:6px solid var(--yellow);}
  .tag{
    display:inline-block;
    border:1px solid #f9a825;
    border-radius:20px;
    padding:1px 12px;
    margin:2px 6px 2px 0;
    background:#fffde7;
    font-size:13px;
    color:#8d6e00;
  }
  .fill-line{
    display:inline-block;
    min-width:150px;
    border-bottom:1px dashed #999;
    height:1.25em;
    vertical-align:middle;
  }
  .fill-line.long{min-width:70%;}

  /* 星级评价表格 */
  .stars-section {
    background:#f3e5f5; 
    border-left:6px solid #8e24aa;
    border-radius:12px;
    padding:12px 16px;
    margin:12px 0;
  }
  .stars-section h4 {
    margin: 0 0 10px 0;
    font-size: 15px;
    color: #6a1b9a;
  }
  .star-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    text-align: center;
  }
  .star-table th, .star-table td {
    padding: 6px 4px;
    border-bottom: 1px dashed #e1bee7;
  }
  .star-table th {
    color: #8e24aa;
    font-weight: 600;
  }
  .star-table td:first-child {
    text-align: left;
    padding-left: 0;
  }
  .star-check {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    border: 1px solid #ce93d8;
    border-radius: 4px;
    background: #fff;
    color: #8e24aa;
    font-weight: bold;
    cursor: pointer;
    margin: 0 2px;
    font-size: 12px;
    user-select: none;
  }
  .star-check.selected {
    background: #8e24aa;
    color: #fff;
    border-color: #8e24aa;
  }
  
  .stamp, .discover {
    border-radius:12px;
    padding:12px 16px;
    margin:12px 0;
    line-height:1.8;
    font-size:15px;
  }
  .stamp{background:#e0f2f1; border-left:6px solid #00897b;}
  .discover{background:#efebe9; border-left:6px solid #6d4c41;}

  @media (max-width:600px){
    .modal-card{padding:18px 16px;}
    .modal-card h2{font-size:22px;}
    .star-table { font-size: 12px; }
    .star-check { width: 18px; height: 18px; line-height: 18px; font-size: 10px; }
  }
</style>
</head>

    foodDesc: "姜汁与奶凝固，甜辣嫩滑，是顺德经典甜品。",
    intro: "姜撞奶看似简单，却需要温度、速度和时机恰到好处。走到最后一站，也不能只会一个动作，而要把前面学过的直线、折线、曲线、传球、跑位和射门全部串起来，完成一次真正的足球挑战。",
    mathTip: "在小场地上标出起点、传球点、射门点等“点”，画出运球和跑位“线”，用斜线表示经过的“面”。",
    stars: ['能完成连续技术组合', '设计图中的点、线、面清晰', '能根据实际练习修改方案']
  },
  {
    food: "猪杂粥",
    to: "顺德·猪杂粥",
    foodDesc: "粥底绵滑，猪杂鲜嫩，温暖收尾，是顺德宵夜代表。",
    intro: "一碗热腾腾的猪杂粥，是顺德美食之旅的温暖收尾。18关走到这里，也该停下来看看：我从哪里出发？走过了哪些路线？又成长了多少？",
    mathTip: "记录成绩，与之前的数据进行对比，判断进步幅度。",
    stars: ['能完成重测并如实记录', '能总结收获、发现问题并提出改进目标', '能对比数据评估成长']
  }
];

const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

// 绑定点击事件
document.querySelectorAll('.hotspot').forEach(el => {
  el.addEventListener('click', () => {
    const id = parseInt(el.getAttribute('data-id'));
    if (id && stations[id - 1]) {
      showStation(id - 1);
    }
  });
});

function showStation(index) {
  const st = stations[index];
  const from = index === 0 ? '出发·顺德' : stations[index - 1].to;

  // 生成星级评价表 HTML
  let starTableHTML = `
    <div class="stars-section">
      <h4>⭐ 我的表现（自评+家长评，在对应星级格内勾选）</h4>
      <table class="star-table">
        <thead>
          <tr>
            <th style="text-align:left;">评价项目</th>
            <th>★</th>
            <th>★★</th>
            <th>★★★</th>
          </tr>
        </thead>
        <tbody>
  `;
  
  st.stars.forEach((item) => {
    starTableHTML += `
      <tr>
        <td>${item}</td>
        <td><span class="star-check" onclick="toggleStar(this)">★</span></td>
        <td><span class="star-check" onclick="toggleStar(this)">★★</span></td>
        <td><span class="star-check" onclick="toggleStar(this)">★★★</span></td>
      </tr>
    `;
  });

  starTableHTML += `
        </tbody>
      </table>
    </div>
  `;

  modalContent.innerHTML = `
    <div class="route-bar">
      <span>🚶 路线：${from}</span>
      <span>👣 👣 👣</span>
      <span>➜ 到达：${st.to}</span>
    </div>
    <h2>第${index + 1}站｜${st.food}</h2>
    <div class="food-desc">
      <strong>🍽 美食介绍：</strong>${st.foodDesc}<br>
      <strong>寻味链接：</strong>${st.intro}
    </div>
    <div class="check">
      <strong>📍 我的打卡点：</strong>${st.to} <span class="fill-line"></span>
    </div>
    <div class="math">
      <strong>📐 今天发现的数学：</strong>
      <span class="tag">点</span>
      <span class="tag">线</span>
      <span class="tag">面</span>
      <div>${st.mathTip}</div>
    </div>
    ${starTableHTML}
    <div class="stamp">
      <strong>🖐 打卡印章：</strong><span class="fill-line"></span>
    </div>
    <div class="discover">
      <strong>💬 我今天最大的发现：</strong><span class="fill-line long"></span>
    </div>
  `;
  overlay.classList.add('active');
}

// 切换星星选中状态
function toggleStar(el) {
  const row = el.parentElement.parentElement;
  const siblings = row.querySelectorAll('.star-check');
  siblings.forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

function closeModal() {
  overlay.classList.remove('active');
}

// 点击遮罩层关闭
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// 按 Esc 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
